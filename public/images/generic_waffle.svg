<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shadow -->
  <ellipse cx="100" cy="178" rx="62" ry="12" fill="#FFAFCC" opacity="0.5"/>

  <!-- Plate -->
  <ellipse cx="100" cy="168" rx="70" ry="14" fill="#FFF5E4" stroke="#7A4B3A" stroke-width="3"/>

  <!-- Waffle body -->
  <rect x="36" y="88" width="128" height="80" rx="18" fill="#FFD166" stroke="#7A4B3A" stroke-width="4"/>

  <!-- Waffle grid lines (horizontal) -->
  <line x1="36" y1="110" x2="164" y2="110" stroke="#7A4B3A" stroke-width="2.5" opacity="0.4"/>
  <line x1="36" y1="128" x2="164" y2="128" stroke="#7A4B3A" stroke-width="2.5" opacity="0.4"/>
  <line x1="36" y1="146" x2="164" y2="146" stroke="#7A4B3A" stroke-width="2.5" opacity="0.4"/>

  <!-- Waffle grid lines (vertical) -->
  <line x1="68"  y1="88" x2="68"  y2="168" stroke="#7A4B3A" stroke-width="2.5" opacity="0.4"/>
  <line x1="100" y1="88" x2="100" y2="168" stroke="#7A4B3A" stroke-width="2.5" opacity="0.4"/>
  <line x1="132" y1="88" x2="132" y2="168" stroke="#7A4B3A" stroke-width="2.5" opacity="0.4"/>

  <!-- Drizzle of sauce -->
  <path d="M55 88 Q65 72 80 80 Q95 68 110 78 Q125 64 142 76 Q152 84 148 88" fill="none" stroke="#A87C65" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Cream puff on top -->
  <ellipse cx="100" cy="88" rx="46" ry="16" fill="white" stroke="#7A4B3A" stroke-width="3"/>
  <path d="M58 86 Q70 68 82 86 Q94 68 106 84 Q118 68 130 86 Q138 72 142 86" fill="white" stroke="#7A4B3A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cute berry accent -->
  <circle cx="76" cy="73" r="8" fill="#FFAFCC" stroke="#7A4B3A" stroke-width="2.5"/>
  <circle cx="100" cy="66" r="8" fill="#FFAFCC" stroke="#7A4B3A" stroke-width="2.5"/>
  <circle cx="124" cy="73" r="8" fill="#FFAFCC" stroke="#7A4B3A" stroke-width="2.5"/>
  <line x1="76"  y1="65" x2="76"  y2="58" stroke="#7A4B3A" stroke-width="2"/>
  <line x1="100" y1="58" x2="100" y2="51" stroke="#7A4B3A" stroke-width="2"/>
  <line x1="124" y1="65" x2="124" y2="58" stroke="#7A4B3A" stroke-width="2"/>
</svg>
