<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Steam lines -->
  <path d="M70 42 Q66 34 70 26 Q74 18 70 10" stroke="#A87C65" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 38 Q96 30 100 22 Q104 14 100 6" stroke="#A87C65" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M130 42 Q126 34 130 26 Q134 18 130 10" stroke="#A87C65" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Cup body -->
  <path d="M50 80 L60 190 Q60 200 70 200 L130 200 Q140 200 140 190 L150 80 Z" fill="#FFF5E4" stroke="#7A4B3A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Drink fill (gradient) -->
  <path d="M53 95 L62 188 Q62 197 70 197 L130 197 Q138 197 138 188 L147 95 Z" fill="#FFD166" opacity="0.7"/>
  <path d="M53 95 L147 95 L147 120 L53 120 Z" fill="#F4A435" opacity="0.4"/>

  <!-- Cup rim -->
  <ellipse cx="100" cy="80" rx="50" ry="10" fill="#FFAFCC" stroke="#7A4B3A" stroke-width="4"/>

  <!-- Whipped cream -->
  <ellipse cx="100" cy="70" rx="44" ry="14" fill="white" stroke="#7A4B3A" stroke-width="2.5"/>
  <path d="M60 68 Q70 52 80 68 Q90 52 100 65 Q110 52 120 68 Q130 52 140 68" fill="white" stroke="#7A4B3A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Straw -->
  <rect x="120" y="20" width="8" height="80" rx="4" fill="#FFAFCC" stroke="#7A4B3A" stroke-width="2"/>

  <!-- Cute dots on cup -->
  <circle cx="80" cy="140" r="6" fill="#FFAFCC" opacity="0.7"/>
  <circle cx="100" cy="155" r="6" fill="#FFAFCC" opacity="0.7"/>
  <circle cx="118" cy="138" r="5" fill="#FFAFCC" opacity="0.6"/>
</svg>
